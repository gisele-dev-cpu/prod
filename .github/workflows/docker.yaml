name: docker build and push

on: 
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v4
        
      - name: Debug Repository
        run: |
          pwd
          ls -la
          echo "----- Dockerfile -----"
          cat Dockerfile

      - name: checkout xashy-webapp repo
        uses: actions/checkout@v4
        with:
          repository: gisele-dev-cpu/xashy-webapp
          path: xashy-webapp

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up docker building
        uses: docker/setup-buildx-action@v3

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t xashy/devapp:latest .

      - name: Push Docker image
        run: docker push xashy/devapp:latest

      - name: Fix workspace permissions
        run: chmod -R 777 ${{ github.workspace }}

      - name: Run Trivy Vulnerablinlty Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
            image-ref: 'xashy/devapp:latest'
            format: 'table'
            exit-code: '0'
            output: trivy-report.txt
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
      #- name: Run ZAP Full Scan
      #  uses: zaproxy/action-full-scan@v0.12.0
       # with:
          #  target: 'http://localhost:8080'
          #  docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          #  cmd_options: '-a' #scan all
          #  token: ${{ secrets.GITHUB_TOKEN }}
           # allow_issue_writing: true 
            
   #   - name: upload ZAP Report
    #    uses: actions/upload-artifact@v4
     #   with: 
       #   name: zap-full-report
       #   path: |
         #   report.html
         #   report.md
          #  report.json
      - name: Tag Image for ECR
        run: |
          docker tag \
          xashy/devapp:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/xashy-devapp-repo:latest

      - name: Push to ECR
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/xashy-devapp-repo:latest
